<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YTQJK 知识库</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">YK</span><div><p class="eyebrow">YTQJK LOCAL KNOWLEDGE</p><h1>知识库控制台</h1></div></div>
    <div class="actions"><div id="update-panel" class="update-panel" hidden><span id="update-status" role="status"></span><button id="install-update" type="button" title="安装最新版本">↓ 更新</button></div><span class="sync-state"><i></i><span id="updated">读取中</span></span><button id="refresh" title="刷新数据" aria-label="刷新数据">↻</button></div>
  </header>
  <main>
    <section class="summary" aria-label="知识库摘要">
      <article><span>已验证</span><strong id="verified-count">-</strong></article>
      <article><span>已批准经验</span><strong id="approved-count">-</strong></article>
      <article><span>候选经验</span><strong id="candidate-count">-</strong></article>
      <article><span>锚定会话</span><strong id="session-count">-</strong></article>
      <article class="root"><span>知识根</span><strong id="root">-</strong></article>
    </section>
    <section class="libraries" aria-label="知识库结构">
      <article class="global-library"><div><span class="section-kicker">总库</span><h2>总知识库</h2></div><dl id="global-library"></dl></article>
      <article class="project-library"><div><span class="section-kicker">子库</span><h2>项目知识子库</h2><p>项目首次访问后自动登记；按需建立源码索引。</p></div><strong id="project-library-count">-</strong></article>
    </section>
    <section class="workspace">
      <aside>
        <section class="intake" aria-labelledby="intake-title">
          <div class="panel-heading"><span class="panel-index">01</span><h2 id="intake-title">投递资料</h2></div>
          <label class="drop-zone" for="file-input"><span class="drop-title">拖入资料</span><small>文本、Office、图片或音频，单份最大 10 MiB</small></label>
          <input id="file-input" type="file" accept=".aac,.adoc,.asciidoc,.bat,.bib,.c,.cc,.cfg,.clj,.cljc,.cljs,.cmake,.coffee,.conf,.cpp,.cs,.css,.csv,.dart,.diff,.docx,.dockerfile,.elm,.env.example,.ex,.exs,.fish,.flac,.fs,.fsx,.gitattributes,.gitignore,.gif,.go,.gradle,.graphql,.groovy,.h,.hcl,.hpp,.html,.ini,.jade,.java,.jpeg,.jl,.jpg,.js,.json,.jsonl,.jsx,.kt,.kts,.less,.liquid,.log,.lua,.m4a,.md,.mdx,.mjs,.mk,.mp3,.nim,.nix,.ogg,.opus,.php,.pl,.pm,.png,.pptx,.properties,.proto,.prisma,.ps1,.psd1,.pug,.py,.r,.rake,.rb,.rst,.rs,.sass,.sbt,.scss,.sh,.sol,.sql,.styl,.svg,.swift,.tf,.toml,.ts,.tsx,.txt,.v,.vala,.vim,.vue,.wav,.webp,.xaml,.xlsx,.xml,.yaml,.yml,.zsh" hidden>
          <input id="folder-input" type="file" webkitdirectory multiple hidden>
          <label class="folder-select" for="folder-input">选择文件夹</label>
          <label for="purpose">资料作用</label>
          <input id="purpose" maxlength="500" placeholder="例如：说明部署步骤、记录故障根因、作为接口规范参考">
          <label for="note">也可直接粘贴</label>
          <textarea id="note" rows="4" placeholder="输入可复用的资料、结论或复盘记录"></textarea>
          <button id="submit-intake">存为候选资料</button><div id="intake-progress" hidden role="status"><div><span id="intake-stage">准备中</span><b id="intake-percent">0%</b></div><i><i id="intake-progress-bar"></i></i></div><p id="intake-status" role="status"></p>
        </section>
        <label class="filter-label" for="filter">筛选条目</label>
        <div class="search-wrap"><input id="filter" type="search" placeholder="路径、类别或状态"></div>
        <div class="legend"><span class="dot verified"></span>已验证 <span class="dot approved"></span>已批准 <span class="dot candidate"></span>候选</div>
        <nav id="documents" aria-label="知识文档"></nav>
      </aside>
      <section class="detail" aria-live="polite">
        <div id="empty"><span class="empty-mark">+</span><h2>选择一条知识</h2><p>候选条目只用于审阅，不等同于已批准经验。</p></div>
        <article id="preview" hidden><div class="detail-head"><span id="state"></span><code id="path"></code></div><textarea id="content" hidden></textarea><div id="preview-actions" hidden><button id="approve-candidate" hidden>批准入库</button><button id="save-candidate">保存修改</button><button id="delete-candidate">删除候选资料</button></div></article>
      </section>
    </section>
    <section class="projects"><div class="section-title"><div><span class="section-kicker">项目层</span><h2>项目知识子库</h2></div><span id="global-status"></span></div><div id="project-grid"></div></section>
    <section class="projects"><div class="section-title"><div><span class="section-kicker">会话层</span><h2>锚定会话</h2></div><span>按项目聚合，展开查看匿名会话</span></div><div id="session-grid"></div></section>
  </main>
  <dialog id="project-library-dialog"><header><div><span class="section-kicker">项目子库</span><h2 id="project-library-title">读取中</h2><p id="project-library-meta"></p></div><button id="close-project-library" title="关闭" aria-label="关闭">×</button></header><p id="project-library-empty" hidden>这个项目尚未建立可浏览的索引内容。</p><div id="project-library-files"></div></dialog>
  <script src="app.js"></script>
  <script src="update.js"></script>
</body>
</html>
