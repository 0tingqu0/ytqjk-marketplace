name: Cross-platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TEMP: ${{ github.workspace }}/../.ytqjk-test-tmp
      TMP: ${{ github.workspace }}/../.ytqjk-test-tmp
      TMPDIR: ${{ github.workspace }}/../.ytqjk-test-tmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare test temp directory
        run: python -c "import os; from pathlib import Path; Path(os.environ['TEMP']).mkdir(parents=True, exist_ok=True)"
      - name: Install test dependencies
        run: python -m pip install pytest Pillow==12.3.0 numpy==2.3.5
      - name: Run the complete repository suite
        run: python -B -m pytest -q

  vector-linux:
    name: Ubuntu vector round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      YTQJK_VECTOR_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Prepare isolated vector runtime
        run: python -B plugins/ytqjk-agentic-orchestrator/skills/ytqjk/scripts/bootstrap_runtime.py --knowledge-root "$RUNNER_TEMP/ytqjk"
      - name: Run vector integration test
        run: |
          export YTQJK_MODEL_CACHE="$RUNNER_TEMP/ytqjk/models"
          "$RUNNER_TEMP/ytqjk/.runtime/bin/python" -B -m unittest \
          plugins.ytqjk-agentic-orchestrator.skills.ytqjk.scripts.tests.test_vector_store -v
