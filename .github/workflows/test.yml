name: Cross-platform Go tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.25.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run complete Go suite
        run: go test ./...
      - name: Build CLI
        run: go build -trimpath ./cmd/ytqjk
      - name: Verify installer dry run
        shell: bash
        if: runner.os != 'Windows'
        run: sh ./install.sh --mode knowledge-only --target-root "$RUNNER_TEMP/ytqjk-target" --project-bootstrap off --dashboard-service off --json
      - name: Verify installer dry run on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 --mode knowledge-only --target-root "$env:RUNNER_TEMP\ytqjk-target" --project-bootstrap off --dashboard-service off --json

  quality:
    name: Go quality and migration guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Require gofmt-clean sources
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal)"
          test -z "$files" || { printf 'Unformatted Go files:\n%s\n' "$files"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race ./...
      - name: Require Go-only first-party runtime
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name '*.py' -not -path './.git/*' | grep -q .; then
            echo 'Python runtime source remains after the Go migration.' >&2
            find . -type f -name '*.py' -not -path './.git/*'
            exit 1
          fi
      - name: Cross-compile release targets
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath ./cmd/ytqjk
          done
